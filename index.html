<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Haunted Radio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Almendra:ital,wght@0,400;0,700;1,400&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one centred column — title, level name, the radio of the current level, five ivory preset keys, then the next-radio prompt or the coordinates */
:root{
  --night:#0f0a18; --plum:#24153a; --wood:#5b3216; --amber:#ffb347;
  --ivory:#efe2c4; --ghost:#b8ffc9; --ink:#e9dcc0; --muted:#a8946f;
  --display:'Almendra SC','Cinzel','Palatino Linotype',Georgia,serif;
  --text:'Almendra','Palatino Linotype',Georgia,serif;
  --mono:'Share Tech Mono','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#2b1a45 0%,var(--night) 60%) fixed,var(--night);color:var(--ink);font-family:var(--text);overflow-x:hidden;-webkit-tap-highlight-color:transparent;transition:background .8s}
body.lv2{background:radial-gradient(120% 80% at 50% 0%,#3a1450 0%,#0e0614 60%) fixed,#0e0614}
body.lv3{background:radial-gradient(120% 80% at 50% 0%,#123440 0%,#060d12 60%) fixed,#060d12}
.stage{min-height:100%;padding-top:52px!important;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,52px);margin:6px 0 0;letter-spacing:.04em;color:#ffcf86;text-shadow:0 0 18px rgba(255,150,40,.45),0 2px 0 #3a1d08;text-wrap:balance;text-align:center;line-height:1}
body.lv2 h1{color:#e9c2ff;text-shadow:0 0 18px rgba(190,100,255,.5),0 2px 0 #2a0a3a}
body.lv3 h1{color:#bff3ff;text-shadow:0 0 18px rgba(90,210,255,.5),0 2px 0 #06222c}
.tag{margin:-6px 0 0;font-style:italic;color:var(--muted);font-size:16px;text-align:center}
.music{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:20;font-family:var(--display);font-size:15px;background:rgba(36,21,58,.85);color:var(--muted);border:1px solid #5a4378;border-radius:999px;padding:7px 14px;cursor:pointer}
.music[aria-pressed="true"]{color:#ffcf86;border-color:#c98a3a;box-shadow:0 0 12px rgba(255,160,60,.35)}
.music:focus-visible,.key:focus-visible,.knob:focus-visible,.next:focus-visible,.restart:focus-visible{outline:2px solid var(--ghost);outline-offset:3px}

.radio{position:relative;width:min(92vw,400px,calc((100vh - 290px)*360/460));min-width:250px;aspect-ratio:360/460;max-width:100%;user-select:none;-webkit-user-select:none}
.radio.appear{animation:appear 1.2s ease-out}
@keyframes appear{0%{opacity:0;filter:blur(6px) brightness(2)}100%{opacity:1;filter:none}}
.radio svg.cab{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.7))}
.radio.thud{animation:thud .18s ease-out}
@keyframes thud{0%{transform:translate(0,0)}30%{transform:translate(-2px,2px) rotate(-.4deg)}60%{transform:translate(2px,-1px) rotate(.3deg)}100%{transform:none}}
#dial{position:absolute;left:13.89%;top:64.35%;width:72.22%;height:16.96%;border-radius:8px;touch-action:none;cursor:ew-resize}
#eye{position:absolute;left:44.44%;top:86.52%;width:11.11%;aspect-ratio:1;border-radius:50%;pointer-events:none}
.knob{position:absolute;aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:grab;touch-action:none;background:transparent}
#power{left:14.44%;top:85.65%;width:14.44%}
#powerFace{transform:rotate(-50deg);transition:transform .22s cubic-bezier(.3,1.6,.5,1)}
#powerFace.on{transform:rotate(50deg)}
#tune{left:66.11%;top:84.35%;width:19.44%}
.knob .face{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a4a26,#3a1d0b 60%,#1e0e05);box-shadow:0 3px 6px rgba(0,0,0,.7),inset 0 -2px 4px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,210,150,.25)}
.knob .face::before{content:"";position:absolute;inset:9%;border-radius:50%;background:repeating-conic-gradient(#4a2711 0 6deg,#2d150a 6deg 12deg);opacity:.75}
.knob .face::after{content:"";position:absolute;left:47%;top:8%;width:6%;height:30%;border-radius:3px;background:var(--ivory);box-shadow:0 0 4px rgba(255,230,180,.6)}
/* coffin set: ebony knobs with brass rims */
.radio.l2 .knob .face{background:radial-gradient(circle at 35% 30%,#4d3a49,#1b1019 58%,#070309);box-shadow:0 0 0 2px #b8893a,0 3px 6px rgba(0,0,0,.8),inset 0 2px 3px rgba(230,190,255,.25)}
.radio.l2 .knob .face::before{background:repeating-conic-gradient(#2c1d29 0 8deg,#130a11 8deg 16deg)}
.radio.l2 .knob .face::after{background:#efcf7a;box-shadow:0 0 5px rgba(240,200,110,.7)}
/* tombstone set: bone knobs */
.radio.l3 .knob .face{background:radial-gradient(circle at 35% 30%,#fffaf0,#d9d0b8 55%,#8a816b);box-shadow:0 0 0 2px #3a3c41,0 3px 6px rgba(0,0,0,.8),inset 0 -2px 4px rgba(60,50,30,.45)}
.radio.l3 .knob .face::before{background:repeating-conic-gradient(#e6dfcc 0 8deg,#c9bfa6 8deg 16deg)}
.radio.l3 .knob .face::after{background:#1f2326;box-shadow:none}
.wisp{position:absolute;bottom:40%;width:16%;pointer-events:none;opacity:0;animation:rise 4.5s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:.85}100%{opacity:0;transform:translateY(-180%) translateX(var(--dx)) scale(1.1)}}

.presets{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.key{display:flex;flex-direction:column;align-items:center;gap:4px;width:56px;padding:6px 0 8px;border-radius:10px 10px 14px 14px;border:1px solid #6b5536;background:linear-gradient(#f4e9cf,#d6c39b);color:#3a2410;box-shadow:0 4px 0 #6d5634,0 6px 10px rgba(0,0,0,.5);cursor:pointer;font-family:var(--display);transition:transform .08s}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #6d5634,0 2px 4px rgba(0,0,0,.5)}
.key .rn{font-size:13px;letter-spacing:.1em;color:#7a5530}
.key .dg{font-family:var(--mono);font-size:26px;line-height:1;min-height:26px;color:#2a160a}
.key.filled .dg{color:#7d1f12}
body.lv2 .key{background:linear-gradient(#3b2a38,#1e131c);border-color:#b8893a;color:#efcf7a;box-shadow:0 4px 0 #6e4c18,0 6px 10px rgba(0,0,0,.6)}
body.lv2 .key .rn{color:#c9a25a}body.lv2 .key .dg{color:#f3e2ff}body.lv2 .key.filled .dg{color:#d99bff}
body.lv3 .key{background:linear-gradient(#a7aab0,#6c6f75);border-color:#2b2d31;color:#1c1e21;box-shadow:0 4px 0 #34363b,0 6px 10px rgba(0,0,0,.6)}
body.lv3 .key .rn{color:#2b2d31}body.lv3 .key .dg{color:#111315}body.lv3 .key.filled .dg{color:#0b5a40}
.won .key{pointer-events:none}

.passage{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:flick 2.4s ease-out}
.passage p{margin:0;font-style:italic;font-size:18px;color:#d8c7a6;max-width:30ch;text-wrap:balance}
.next{font-family:var(--display);font-size:19px;letter-spacing:.06em;padding:12px 22px;min-height:44px;border-radius:999px;border:1px solid #9dffa8;background:rgba(20,40,24,.75);color:#c9ffd0;box-shadow:0 0 16px rgba(120,255,150,.35);cursor:pointer}
.restart{font-family:var(--text);font-style:italic;font-size:15px;background:none;border:0;color:var(--muted);cursor:pointer;padding:10px 12px;min-height:44px;text-decoration:underline;text-underline-offset:3px}

.coords{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px;font-family:var(--mono);font-size:clamp(28px,8.4vw,42px);letter-spacing:.06em;animation:flick 2.4s ease-out}
.coord-n{color:#8dff88;text-shadow:0 0 8px rgba(141,255,136,.9),0 0 22px rgba(80,255,90,.55);animation:glow 3s ease-in-out infinite}
.coord-w{color:#ffab55;text-shadow:0 0 8px rgba(255,171,85,.9),0 0 22px rgba(255,120,30,.55);animation:glow 3s ease-in-out infinite .6s}
@keyframes glow{50%{filter:brightness(1.25)}}
@keyframes flick{0%{opacity:0}10%{opacity:.8}14%{opacity:.1}22%{opacity:.9}26%{opacity:.2}40%,100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.radio.thud,.radio.appear,.coords,.passage,.coord-n,.coord-w,.wisp{animation:none}.wisp{display:none}}
.adm{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,3,10,.78);padding:16px}
.adm[hidden]{display:none!important}
.adm form{display:flex;flex-direction:column;gap:12px;width:min(320px,100%);background:var(--plum);border:1px solid #5a4378;border-radius:14px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.7)}
.adm h2{margin:0;font-family:var(--display);font-weight:400;color:#ffcf86;font-size:22px;text-align:center}
.adm input{font:16px var(--mono);padding:10px 12px;border-radius:8px;border:1px solid #5a4378;background:#140b22;color:var(--ink)}
.adm .row{display:flex;gap:10px;justify-content:flex-end}
.adm button{font-family:var(--display);font-size:16px;padding:9px 16px;min-height:44px;border-radius:999px;border:1px solid #9dffa8;background:rgba(20,40,24,.75);color:#c9ffd0;cursor:pointer}
.adm button.cx{border-color:#5a4378;background:none;color:var(--muted)}
.adm .err{margin:0;min-height:1.2em;color:#ff8a7a;font-style:italic;text-align:center}
</style>

const TUNES=[tune1,tune2,victory];
function startMusic(){

  const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.09;lg.gain.value=180;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  const os=[38,45,50,53].map((m,i)=>{const o=ctx.createOscillator();o.type="sawtooth";o.frequency.value=440*Math.pow(2,(m+sh-69)/12);o.detune.value=(i%2?-7:6);o.connect(lp);o.start();return o;});

/* ---------- tuning ---------- */
function setFreq(f){freq=Math.max(FMIN,Math.min(FMAX,f));dial.setAttribute("aria-valuenow",Math.round(freq));}

function clunk(){if(!ctx)return;const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),f=LVc.snd.clunk;o.type="square";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.28,t+.05);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.08);o.connect(g);g.connect(master);o.start(t);o.stop(t+.1);}

tune.addEventListener("keydown",keyTune);dial.addEventListener("keydown",keyTune);
function keyTune(e){if(won)return;const k=e.key;let d=0;if(k==="ArrowRight"||k==="ArrowUp")d=1;if(k==="ArrowLeft"||k==="ArrowDown")d=-1;if(!d)return;e.preventDefault();powerOn();d*=e.shiftKey?10:2;knobAng+=d*Math.PI/80;setFreq(freq+d);}

dial.addEventListener("pointerdown",e=>{if(won)return;powerOn();dDrag={x:e.clientX,id:e.pointerId};dial.setPointerCapture(e.pointerId);e.preventDefault();});

const endD=()=>{dDrag=null;};dial.addEventListener("pointerup",endD);dial.addEventListener("pointercancel",endD);

/* ---------- message sequence ---------- */
function cancelSeq(){seqTok++;seqRunning=false;showNum=0;}

function startSeq(st){

  run();
}

/* ---------- presets ---------- */
const vals=[0,0,0,0,0];
const pre=$("presets"),keys=[];
vals.forEach((_,i)=>{const b=document.createElement("button");b.className="key";b.id="key"+(i+1);b.setAttribute("aria-label","Preset "+ROMAN[i+1]);

  pre.appendChild(b);keys.push(b);});
function click(){if(!ctx)return;const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type="square";o.frequency.value=LVc.snd.click;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.03);o.connect(g);g.connect(master);o.start(t);o.stop(t+.04);}

  else{const txt=unlock(SEALED,[...codes.slice(0,L),code].join("|"));if(txt.startsWith("N 38"))win(txt);}
}
function hush(){if(ctx){const t=ctx.currentTime;[stG,whG,thG].forEach(g=>{g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(0,t,.25);});}}
function ghosts(){
  if(reduce)return;const svg='<svg viewBox="0 0 40 50"><path d="M20 2C9 2 4 11 4 22v24l6-5 5 5 5-5 5 5 5-5 6 5V22C36 11 31 2 20 2z" fill="'+LVc.wisp+'" opacity=".85"/><ellipse cx="14" cy="20" rx="3" ry="4.5" fill="#0f0a18"/><ellipse cx="26" cy="20" rx="3" ry="4.5" fill="#0f0a18"/><ellipse cx="20" cy="31" rx="3" ry="4" fill="#0f0a18"/></svg>';
  for(let i=0;i<6;i++){const d=document.createElement("div");d.className="wisp";d.innerHTML=svg;d.style.left=(18+i*11+Math.random()*4)+"%";d.style.animationDelay=(.4+i*.35)+"s";d.style.setProperty("--dx",((Math.random()-.5)*120)+"%");radio.appendChild(d);setTimeout(()=>d.remove(),6000+i*400);}
}
function saveProgress(){}
function levelWin(code){
  won=true;cancelSeq();document.body.classList.add("won");codes[L]=code;saveProgress();
  hush();on=true;TUNES[L]();ghosts();
  setTimeout(()=>{$("passageTxt").textContent=LVc.passage;$("passage").hidden=false;},1600);
  const tok=++advTok,next=L+1;
  setTimeout(()=>{if(tok===advTok&&won&&L===next-1)setLevel(next,true);},(LVc.tuneLen+3)*1000+80);

  setTimeout(()=>{$("cn").textContent=n;$("cw").textContent=w;$("coords").hidden=false;$("restart").hidden=false;},1300);

/* ---------- moving between radios ---------- */
function setLevel(i,fresh){
  L=i;LVc=LV[i];ST=LVc.st;

/* ---------- drawing ---------- */
function size(){const dpr=Math.min(2,window.devicePixelRatio||1);[dial,eye].forEach(c=>{c.width=Math.round(c.clientWidth*dpr);c.height=Math.round(c.clientHeight*dpr);});}
addEventListener("resize",size);size();
const fx=(f,W,p)=>p+(f-FMIN)/(FMAX-FMIN)*(W-2*p);
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function drawDial(staticLvl,t){
  const W=dial.width,H=dial.height,p=W*.05,u=H/58;if(!W)return;const T=LVc.dial;
  dg.clearRect(0,0,W,H);rr(dg,0,0,W,H,8*u);dg.save();dg.clip();
  const Lf=onFade;
  const gr=dg.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,mix(T.a,T.b,Lf));gr.addColorStop(1,mix(T.c,T.d,Lf));
  dg.fillStyle=gr;dg.fillRect(0,0,W,H);
  {const rg=dg.createRadialGradient(W/2,H*.55,0,W/2,H*.55,W*.5);rg.addColorStop(0,"rgba("+T.glow+","+(.35*Lf)+")");rg.addColorStop(1,"rgba("+T.glow+",0)");dg.fillStyle=rg;dg.fillRect(0,0,W,H);}
  const ink=Lf>.3?T.ink:"rgba(201,164,106,.35)";dg.shadowColor="rgba("+T.sh+","+(.9*Lf)+")";dg.shadowBlur=6*u*Lf;
  dg.strokeStyle=ink;dg.fillStyle=ink;dg.lineWidth=Math.max(1,u*.8);
  for(let f=550;f<=1650;f+=10){const x=fx(f,W,p),big=f%50===0;dg.beginPath();dg.moveTo(x,H*.42);dg.lineTo(x,H*(big?.66:.54));dg.stroke();}
  dg.font=Math.round(14*u)+"px 'Almendra SC',Georgia,serif";dg.textAlign="center";dg.textBaseline="alphabetic";
  [600,800,1000,1200,1400,1600].forEach(f=>dg.fillText(String(f/10),fx(f,W,p),H*.36));
  dg.font=Math.round(8.5*u)+"px 'Almendra SC',Georgia,serif";dg.fillText(T.word,W/2,H*.88);
  dg.shadowBlur=0;
  const nx=fx(freq,W,p);
  if(sig>.3&&on&&!won){const a=Math.min(1,(sig-.3)/.6)*(.55+.25*Math.sin(t/240));
    const gx=nx+(nx<W/2?1:-1)*W*.13,gy=H*.5+Math.sin(t/400)*u*2;
    dg.save();dg.globalAlpha=a;dg.shadowColor="rgba("+T.gh+",.9)";dg.shadowBlur=10*u;dg.fillStyle="rgba("+T.ghf+",.85)";
    dg.beginPath();dg.ellipse(gx,gy,9*u,13*u,0,0,Math.PI*2);dg.fill();dg.shadowBlur=0;dg.fillStyle="rgba(20,10,20,.85)";
    dg.beginPath();dg.ellipse(gx-3.3*u,gy-3*u,1.7*u,2.6*u,0,0,7);dg.ellipse(gx+3.3*u,gy-3*u,1.7*u,2.6*u,0,0,7);dg.fill();
    dg.beginPath();dg.ellipse(gx,gy+4.5*u,1.8*u,2.6*u+Math.sin(t/180)*u*.8,0,0,7);dg.fill();dg.restore();
    if(showNum){numA=Math.min(1,numA+.04);}else numA=Math.max(0,numA-.06);
  }else numA=Math.max(0,numA-.06);
  if(numA>0&&showNum){const gx=nx+(nx<W/2?1:-1)*W*.29;dg.save();dg.globalAlpha=numA*(.75+.25*Math.sin(t/120));dg.font=Math.round(30*u)+"px 'Almendra SC',Georgia,serif";dg.textAlign="center";dg.textBaseline="middle";dg.shadowColor="rgba("+T.num+",1)";dg.shadowBlur=14*u;dg.fillStyle="rgba("+T.numf+",.95)";dg.fillText(ROMAN[showNum],gx,H*.56);dg.restore();}
  dg.save();dg.shadowColor="rgba(0,0,0,.5)";dg.shadowBlur=3*u;dg.strokeStyle=T.needle;dg.lineWidth=2.2*u;dg.beginPath();dg.moveTo(nx,H*.06);dg.lineTo(nx,H*.94);dg.stroke();dg.restore();
  const vg=dg.createRadialGradient(W/2,H/2,H*.2,W/2,H/2,W*.6);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba("+T.vig+",.55)");dg.fillStyle=vg;dg.fillRect(0,0,W,H);
  dg.fillStyle="rgba(255,255,255,.07)";dg.fillRect(0,0,W,H*.22);

function mix(a,b,t){return "rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",")+")";}
function drawEye(){
  const W=eye.width;if(!W)return;const c=W/2,r=W*.46,E=LVc.eye;eg.clearRect(0,0,W,W);
  eg.fillStyle="#0b0604";eg.beginPath();eg.arc(c,c,r,0,7);eg.fill();
  if(onFade>.05){
    const b=Math.min(1,onFade*(.55+.45*sig)+flash*.6+winFade);
    const gr=eg.createRadialGradient(c,c,r*.15,c,c,r);gr.addColorStop(0,"rgba("+E[0]+","+b+")");gr.addColorStop(.5,"rgba("+E[1]+","+(b*.9)+")");gr.addColorStop(1,"rgba("+E[2]+","+(b*.8)+")");
    eg.fillStyle=gr;eg.beginPath();eg.arc(c,c,r*.92,0,7);eg.fill();
    const open=(won?.02:(1-sig))*Math.PI*.55+.06;
    eg.fillStyle="#0b0604";eg.beginPath();eg.moveTo(c,c);eg.arc(c,c,r*.95,-Math.PI/2-open,-Math.PI/2+open);eg.closePath();eg.fill();
  }
  eg.fillStyle="#1a0d06";eg.beginPath();eg.arc(c,c,r*.2,0,7);eg.fill();
}
function tick(t){
  onFade+=((on?1:0)-onFade)*.06;if(won)winFade=Math.min(1,winFade+.01);flash*=.9;
  const NEAR=LVc.near,LOCK=LVc.lock,S=LVc.snd;
  let best=null,off=1e9;for(const s of ST){const o=freq-s.f;if(Math.abs(o)<Math.abs(off)){off=o;best=s;}}
  const ao=Math.abs(off);sig=on?Math.pow(Math.max(0,1-ao/NEAR),1.5):0;
  const locked=on&&!won&&ao<=LOCK;
  if(locked){if(lockSt!==best){cancelSeq();lockSt=best;lockSince=t;}else if(!seqRunning&&t-lockSince>600)startSeq(best);}
  else if(lockSt){cancelSeq();lockSt=null;}
  const staticLvl=won?0:on?(.9*(1-sig)+.05):0;
  if(ctx){const now=ctx.currentTime;
    if(!won){stG.gain.setTargetAtTime(staticLvl*.32,now,.05);stBP.frequency.setTargetAtTime(S.bp+Math.sin(t/700)*S.bpw+Math.random()*300,now,.1);
      const wg=on&&ao<NEAR&&ao>2?.035*(1-ao/NEAR):0;whG.gain.setTargetAtTime(wg,now,.05);whO.frequency.setTargetAtTime(30+ao*38,now,.03);
      thG.gain.setTargetAtTime(on?.09*sig*sig:0,now,.08);thO.frequency.setTargetAtTime(best.p*(1+off*.004),now,.05);}
    humG.gain.setTargetAtTime(on&&!won?.012:0,now,.2);}
  glowA.setAttribute("opacity",(onFade*(.22+.22*sig+flash*.3)*(1-winFade)).toFixed(3));
  glowG.setAttribute("opacity",(winFade*.9).toFixed(3));
  $("tuneFace").style.transform="rotate("+knobAng+"rad)";
  const pf=$("powerFace");if(pf.classList.contains("on")!==on){pf.classList.toggle("on",on);$("power").setAttribute("aria-pressed",on);}
  drawDial(staticLvl,t);drawEye();
  requestAnimationFrame(tick);
}
